<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="heroPh">
  <title id="heroPh">Экосистема СтройЛиды: потоки контактов сходятся в воронку над растущей диаграммой спроса</title>

  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101C4E"/><stop offset="1" stop-color="#070C22"/>
    </linearGradient>
    <linearGradient id="orgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A4D"/><stop offset="1" stop-color="#FF5A00"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3C74"/><stop offset="1" stop-color="#16224A"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A5BC7"/><stop offset="1" stop-color="#1B2A57"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF6B1A" stop-opacity=".32"/>
      <stop offset="1" stop-color="#FF6B1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shad" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gr" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="clipFrame"><rect width="720" height="640" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#clipFrame)">

    <!-- Фон, сетка, дыхание свечения -->
    <rect width="720" height="640" fill="url(#bgG)"/>
    <rect width="720" height="640" fill="url(#gr)"/>
    <circle cx="360" cy="230" r="230" fill="url(#glow)">
      <animate attributeName="opacity" values=".55;1;.55" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Всплывающие частицы -->
    <circle cx="140" cy="600" r="3" fill="#8FA6E8">
      <animate attributeName="cy" values="600;90" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.5;.5;0" keyTimes="0;.15;.7;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="590" cy="600" r="2.5" fill="#FF8A3D">
      <animate attributeName="cy" values="600;90" dur="13s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.5;.5;0" keyTimes="0;.15;.7;1" dur="13s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="600" r="2" fill="#8FA6E8">
      <animate attributeName="cy" values="600;90" dur="9s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.4;.4;0" keyTimes="0;.15;.7;1" dur="9s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="600" r="2.5" fill="#8FA6E8">
      <animate attributeName="cy" values="600;90" dur="12s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.45;.45;0" keyTimes="0;.15;.7;1" dur="12s" begin="-7s" repeatCount="indefinite"/>
    </circle>

    <!-- Орбиты и спутники -->
    <g>
      <circle cx="360" cy="260" r="165" fill="none" stroke="#8FA6E8" stroke-opacity=".28" stroke-dasharray="3 10"/>
      <animateTransform attributeName="transform" type="rotate" from="0 360 260" to="360 360 260" dur="36s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="360" cy="260" r="105" fill="none" stroke="#FF6B1A" stroke-opacity=".3" stroke-dasharray="2 8"/>
      <animateTransform attributeName="transform" type="rotate" from="360 360 260" to="0 360 260" dur="24s" repeatCount="indefinite"/>
    </g>
    <circle cx="360" cy="95" r="5" fill="#FF6B1A">
      <animateTransform attributeName="transform" type="rotate" from="0 360 260" to="360 360 260" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="155" r="4" fill="#8FA6E8">
      <animateTransform attributeName="transform" type="rotate" from="360 360 260" to="0 360 260" dur="18s" repeatCount="indefinite"/>
    </circle>

    <!-- Импульсы от воронки -->
    <circle cx="360" cy="195" r="20" fill="none" stroke="#FF6B1A" stroke-width="1.5">
      <animate attributeName="r" values="16;125" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="195" r="20" fill="none" stroke="#FF6B1A" stroke-width="1.5">
      <animate attributeName="r" values="16;125" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Линии потока с бегущим пункктиром -->
    <g fill="none" stroke="#FF6B1A" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="5 7">
      <path d="M214 280 C 260 318 310 306 352 272">
        <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M506 280 C 460 318 410 306 368 272">
        <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Точки-контакты летят в воронку -->
    <circle r="5" fill="#FF8A3D">
      <animateMotion path="M208 286 C 260 322 310 310 356 274" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#FF8A3D">
      <animateMotion path="M512 286 C 460 322 410 310 364 274" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#8FA6E8">
      <animateMotion path="M208 286 C 260 322 310 310 356 274" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </circle>

    <!-- Тени под кубами -->
    <ellipse cx="360" cy="286" rx="95" ry="18" fill="url(#shad)"/>
    <ellipse cx="208" cy="386" rx="62" ry="12" fill="url(#shad)"/>
    <ellipse cx="512" cy="386" rx="62" ry="12" fill="url(#shad)"/>

    <!-- Кубы -->
    <g stroke-linejoin="round">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="6s" repeatCount="indefinite"/>
        <path d="M360 120l70 35-70 35-70-35z" fill="url(#orgG)"/>
        <path d="M290 155l70 35v80l-70-35z" fill="#C2410C"/>
        <path d="M430 155l-70 35v80l70-35z" fill="#E85D04"/>
        <circle cx="360" cy="120" r="6" fill="#FFB27A">
          <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;.5;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="7s" begin="-2s" repeatCount="indefinite"/>
        <path d="M208 270l48 24-48 24-48-24z" fill="url(#blueG)" stroke="#3A4E8F"/>
        <path d="M160 294l48 24v56l-48-24z" fill="#16224A" stroke="#3A4E8F"/>
        <path d="M256 294l-48 24v56l48-24z" fill="#1B2A57" stroke="#3A4E8F"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="8s" begin="-4s" repeatCount="indefinite"/>
        <path d="M512 270l48 24-48 24-48-24z" fill="url(#blueG)" stroke="#3A4E8F"/>
        <path d="M464 294l48 24v56l-48-24z" fill="#16224A" stroke="#3A4E8F"/>
        <path d="M560 294l-48 24v56l48-24z" fill="#1B2A57" stroke="#3A4E8F"/>
      </g>
    </g>

    <!-- ============ ДИАГРАММА СПРОСА ============ -->
    <g>
      <rect x="120" y="430" width="480" height="162" rx="18" fill="#0B1230" fill-opacity=".72" stroke="#22336B"/>

      <!-- Подписи -->
      <text x="146" y="463" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#8FA6E8" opacity="0">
        СПРОС
        <animate attributeName="opacity" from="0" to="1" begin=".5s" dur=".6s" fill="freeze"/>
      </text>
      <text x="574" y="446" text-anchor="end" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FF8A3D" opacity="0">
        +217%
        <animate attributeName="opacity" from="0" to="1" begin=".7s" dur=".6s" fill="freeze"/>
      </text>

      <!-- Сетка -->
      <g stroke="#fff" stroke-opacity=".05">
        <path d="M146 490H574M146 520H574M146 550H574"/>
        <path d="M146 576H574" stroke-opacity=".14"/>
      </g>

      <!-- Столбцы: вырастают по очереди -->
      <g>
        <rect x="155" y="576" width="26" height="0" rx="4" fill="url(#barB)">
          <animate attributeName="height" from="0" to="28" begin=".3s"  dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
          <animate attributeName="y" from="576" to="548" begin=".3s"  dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
        </rect>
        <rect x="203" y="576" width="26" height="0" rx="4" fill="url(#barB)">
          <animate attributeName="height" from="0" to="40" begin=".42s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
          <animate attributeName="y" from="576" to="536" begin=".42s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
        </rect>
        <rect x="251" y="576" width="26" height="0" rx="4" fill="url(#barB)">
          <animate attributeName="height" from="0" to="34" begin=".54s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
          <animate attributeName="y" from="576" to="542" begin=".54s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
        </rect>
        <rect x="299" y="576" width="26" height="0" rx="4" fill="url(#barB)">
          <animate attributeName="height" from="0" to="52" begin=".66s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
          <animate attributeName="y" from="576" to="524" begin=".66s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
        </rect>
        <rect x="347" y="576" width="26" height="0" rx="4" fill="url(#barB)">
          <animate attributeName="height" from="0" to="64" begin=".78s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
          <animate attributeName="y" from="576" to="512" begin=".78s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
        </rect>
        <rect x="395" y="576" width="26" height="0" rx="4" fill="url(#barB)">
          <animate attributeName="height" from="0" to="58" begin=".9s"  dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
          <animate attributeName="y" from="576" to="518" begin=".9s"  dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
        </rect>
        <rect x="443" y="576" width="26" height="0" rx="4" fill="url(#orgG)">
          <animate attributeName="height" from="0" to="76" begin="1.02s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
          <animate attributeName="y" from="576" to="500" begin="1.02s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
        </rect>
        <rect x="491" y="576" width="26" height="0" rx="4" fill="url(#orgG)">
          <animate attributeName="height" from="0" to="92" begin="1.14s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
          <animate attributeName="y" from="576" to="484" begin="1.14s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
        </rect>
        <rect x="539" y="576" width="26" height="0" rx="4" fill="url(#orgG)">
          <animate attributeName="height" from="0" to="112" begin="1.26s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
          <animate attributeName="y" from="576" to="464" begin="1.26s" dur=".8s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
          <animate attributeName="opacity" values=".85;1;.85" begin="2.6s" dur="2s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Тренд прочерчивается поверх -->
      <path d="M168 542 216 530 264 536 312 518 360 506 408 512 456 494 504 478 552 458"
            fill="none" stroke="#FF8A3D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="420" stroke-dashoffset="420">
        <animate attributeName="stroke-dashoffset" from="420" to="0" begin="1.6s" dur="1s" fill="freeze" calcMode="spline" keySplines=".3 0 .2 1"/>
      </path>
      <circle cx="552" cy="458" r="5" fill="#FF8A3D" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur=".3s" fill="freeze"/>
        <animate attributeName="r" values="4;7;4" begin="2.6s" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Стеклянный блик по диагонали -->
    <g opacity=".55">
      <g transform="rotate(16 360 320)">
        <rect x="-260" y="-80" width="180" height="820" fill="url(#sheenG)">
          <animateTransform attributeName="transform" type="translate" values="0 0; 1240 0" dur="7s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

  </g>

  <!-- Рамка и уголки поверх -->
  <rect x="16" y="16" width="688" height="608" rx="20" fill="none" stroke="#FF6B1A" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="10 8"/>
  <g stroke="#FF6B1A" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M38 62V38h24M658 38h24v24M682 578v24h-24M62 602H38v-24"/>
  </g>
</svg>